<!DOCTYPE html>
<html>
<head>
<title>Deteksi Jari - Tugas Deep Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<style>
body { font-family: Arial; text-align: center; background: #0f172a; color: white; }
#webcam { border-radius: 20px; margin-top: 20px; border: 4px solid #38bdf8; }
button { background: #38bdf8; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
#label-container div { background: #1e293b; margin: 10px auto; padding: 12px; width: 80%; max-width: 300px; border-radius: 10px; font-size: 18px; }
</style>
</head>
<body>
<h1>🤚 Deteksi Gestur Jari</h1>
<p>Tugas Deep Learning - Klasifikasi 3 Jari vs 5 Jari<br>Menggunakan MobileNet + Teachable Machine</p>
<button type="button" onclick="init()">Mulai Kamera</button>
<div id="webcam-container"></div>
<div id="label-container"></div>

<script type="text/javascript">
    const URL = "./my_model/";
    let model, webcam, labelContainer, maxPredictions;
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
        const flip = true;
        webcam = new tmImage.Webcam(300, 300, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }
    }
    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }
    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction = prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(0) + "%";
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
</script>
</body>
</html>
