<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deteksi Jari - Final Fix</title>
<style>body{background:#0f172a;color:#fff;text-align:center;font-family:sans-serif}button{background:#38bdf8;padding:16px 32px;border-radius:12px;border:0;font-size:20px;font-weight:bold}canvas{border-radius:16px;margin-top:15px;border:2px solid #38bdf8}#label div{background:#1e293b;padding:10px;margin:8px auto;width:80%;border-radius:8px}</style>
</head>
<body>
<h1>🤚 Deteksi Gestur Jari</h1>
<p>Tugas Deep Learning - 3 Jari vs 5 Jari</p>
<button onclick="start()">MULAI KAMERA</button>
<p id="log" style="color:yellow">Status: siap</p>
<div id="cam"></div>
<div id="label"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.4/dist/teachablemachine-image.min.js"></script>
<script>
const URL = "https://karimu13.github.io/Deteksi-jari/my_model/";
let model, webcam;
async function start(){
 document.getElementById('log').innerText = '⏳ Download model... tunggu 10 detik, jangan di-close';
 try{
   console.log('load', URL+'model.json');
   model = await tmImage.load(URL+'model.json', URL+'metadata.json');
   document.getElementById('log').innerText = '✅ Model ok! Nyalakan kamera...';
   webcam = new tmImage.Webcam(320,320,true);
   await webcam.setup();
   await webcam.play();
   document.getElementById('cam').appendChild(webcam.canvas);
   window.requestAnimationFrame(loop);
   document.getElementById('log').innerText = '✅ LIVE! Coba 3 jari / 5 jari';
 }catch(e){
   document.getElementById('log').innerText = '❌ GAGAL: '+e.message;
   console.error(e);
   alert('Error: '+e.message+'\nCoba pakai HP atau cek weights.bin');
 }
}
async function loop(){ webcam.update(); await pred(); requestAnimationFrame(loop); }
async function pred(){
 const p = await model.predict(webcam.canvas);
 const l = document.getElementById('label'); l.innerHTML='';
 for(let i=0;i<p.length;i++){ l.innerHTML += '<div>'+p[i].className+' = '+(p[i].probability*100).toFixed(0)+'%</div>'; }
}
</script>
</body>
</html>
